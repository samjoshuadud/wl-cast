[package]
name = "wl-cast"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Screen capture, encoding and input for Wayland compositors"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samjoshuadud/wl-cast"
keywords = ["wayland", "screencast", "screen-capture", "hyprland", "remote-desktop"]
categories = ["multimedia::video", "os::linux-apis"]
exclude = [".github", "flake.nix", "flake.lock"]

[package.metadata.docs.rs]
features = ["webrtc"]

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "remote_desktop", "async-io"], optional = true }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"], optional = true }
openh264 = "0.9.9"
pipewire = { version = "0.10.1", optional = true }
rustix = { version = "1.1", features = ["event", "fs"] }
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"], optional = true }
thiserror = "2.0.21"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }

[features]
ffmpeg = ["dep:ffmpeg-next"]
webrtc = ["dep:str0m"]
portal = ["dep:ashpd", "dep:futures-lite", "dep:pipewire"]

[[example]]
name = "webrtc"
required-features = ["webrtc"]
